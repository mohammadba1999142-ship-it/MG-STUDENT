<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>منصة الطلاب</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial;

      /* الخلفية */
      background-image: url("background.png"); /* غيّر الاسم إذا مختلف */
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      height: 100vh;
    }

    /* محتوى فوق الصورة */
    .content {
      background: rgba(255, 255, 255, 0.6);
      margin: 50px auto;
      width: 80%;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      font-size: 20px;
      color: #333;
    }

    /* أزرار */
    .btn {
      display: inline-block;
      margin: 15px;
      padding: 15px 25px;
      border-radius: 10px;
      color: white;
      text-decoration: none;
      font-size: 18px;
    }

    .btn-ar {
      background: #3b82f6;
    }

    .btn-math {
      background: #22c55e;
    }
  </style>
</head>

<body>

  <div class="content">
    <h1>منصة الطلاب</h1>
    <p>تعلم، العب، واكتشف</p>

    <a href="#" class="btn btn-ar">أنشطة اللغة العربية</a>
    <a href="#" class="btn btn-math">أنشطة الرياضيات</a>
  </div>

</body>
</html>
