<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MG STUDENT</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

/* ===== الأساسيات ===== */
body {
  margin: 0;
  font-family: 'Cairo', sans-serif;
  background-image: url("background.png");
  background-size: 81%;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

/* ===== النافذة المنبثقة ===== */
.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.popup-content {
  background: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
}

.popup button {
  margin-top: 15px;
  padding: 10px 20px;
  border: none;
  background: #4CAF50;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

/* ===== القائمة الجانبية ===== */
.sidebar {
  position: fixed;
  right: 0;
  top: 0;
  width: 220px;
  height: 100%;
  background: rgba(255,255,255,0.9);
  padding: 20px;
  box-shadow: -2px 0 10px rgba(0,0,0,0.1);
}

.menu-item {
  margin: 15px 0;
  padding: 15px;
  background: #f1f1f1;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.menu-item:hover {
  background: #4CAF50;
  color: white;
}

/* ===== تسجيل الدخول ===== */
.login-box {
  position: fixed;
  left: 20px;
  top: 100px;
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 240px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
  z-index: 500;
}

.login-box input {
  width: 100%;
  padding: 8px;
  margin: 6px 0;
  border: 1px solid #ccc;
  border-radius: 6px;
  box-sizing: border-box;
}

.login-box button {
  width: 100%;
  padding: 10px;
  background: #2196F3;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  margin-top: 8px;
}

/* ===== أزرار التمرين ===== */
.actions {
  position: fixed;
  bottom: 20px;
  left: 20px;
}

.actions button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  background: #2196F3;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}
/* ===== تصميم الموبايل ===== */
@media (max-width: 600px) {

    body {
        background-size: cover;
        background-position: 40% center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        overflow-x: hidden;
    }

    /* القائمة اليمنى */
    .sidebar {
        position: fixed;
        right: 0;
        top: 0;

        width: 40vw;
        height: 100vh;

        padding: 10px;
        box-sizing: border-box;

        background: rgba(255,255,255,0.88);

        box-shadow: -2px 0 10px rgba(0,0,0,0.08);
    }

    /* عناصر القائمة */
    .menu-item {
        margin: 10px 0;
        padding: 10px 3px;
        font-size: 12px;
        text-align: center;
        border-radius: 10px;
        white-space: nowrap;
    }
}

    /* معلومات المستخدم */
    #userInfo {
        font-size: 12px;
        text-align: center;
        word-break: break-word;
    }

    /* صندوق تسجيل الدخول */
    .login-box {
        width: 210px;
        max-width: calc(100vw - 20px);
        left: 10px;
        top: 70px;
        padding: 15px;
        box-sizing: border-box;
    }

    .login-box input,
    .login-box button {
        font-size: 14px;
    }

    /* النافذة الترحيبية */
    .popup-content {
        width: 75%;
        max-width: 320px;
        padding: 20px;
        box-sizing: border-box;
    }

    .popup-content h2 {
        font-size: 20px;
    }

    /* زر إنهاء التمرين */
    .actions {
        left: 10px;
        bottom: 10px;
    }

    .actions button {
        padding: 8px 10px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<!-- 🔥 النافذة -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h2>👋 مرحباً بك</h2>
    <button onclick="closePopup()">دخول</button>
  </div>
</div>

<!-- 📌 القائمة الجانبية -->
<div class="sidebar">
  <div class="menu-item" id="loginMenuItem" onclick="toggleLoginBox()">🔐 تسجيل الدخول</div>
  
  <div id="userInfo" style="display:none; padding: 10px; font-weight: bold; color: #2c3e50;"></div>

  <!-- يظهر فقط للمعلم -->
  <div id="teacherPanel" style="display:none;">
    <div class="menu-item" onclick="showResults()">📊 عرض النتائج</div>
  </div>

  <div class="menu-item" onclick="location.href='student.html'">📚 تمارين اللغة العربية</div>
  <div class="menu-item" onclick="location.href='student.html'">➗ تمارين الرياضيات</div>
  <div class="menu-item" id="logoutBtn" style="display:none; background:#e74c3c; color:white;" onclick="logout()">تسجيل الخروج</div>
</div>

<!-- 🟢 صندوق تسجيل الدخول / إنشاء الحساب -->
<div id="loginBox" class="login-box" style="display:none;">
  <h3 id="formTitle">تسجيل الدخول</h3>
  
  <input type="text" id="fullName" placeholder="الاسم الكامل" style="display:none;">
  <input type="email" id="email" placeholder="البريد الإلكتروني">
  <input type="password" id="password" placeholder="كلمة المرور">

  <button id="authSubmitBtn" onclick="handleAuth()">دخول</button>
  
  <p style="font-size: 12px; text-align: center; margin-top: 10px;">
    <a href="#" id="toggleAuthMode" onclick="toggleAuthMode(event)">ليس لديك حساب؟ أنشئ حساباً جديداً</a>
  </p>
</div>

<!-- 🟡 أزرار تجربة -->
<div class="actions">
  <button onclick="saveMark(10)">إنهاء التمرين (10 درجات)</button>
</div>

<!-- 🌐 ربط مشروع Firebase والجافاسكربت -->
<script type="module">
  import { auth, db } from "./firebase-config.js";
  import { 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword, 
    onAuthStateChanged, 
    signOut 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    doc, 
    setDoc, 
    getDoc, 
    collection, 
    addDoc, 
    getDocs 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 🔴 ايميل المعلم المعتمد حصراً (استبدل هذا الإيميل ببريدك الحقيقي)
  const MY_TEACHER_EMAIL = "teacher@gmail.com";

  let currentUserData = null;
  let isSignUpMode = false;

  window.toggleLoginBox = () => {
    const box = document.getElementById("loginBox");
    box.style.display = box.style.display === "none" ? "block" : "none";
  };

  window.toggleAuthMode = (e) => {
    e.preventDefault();
    isSignUpMode = !isSignUpMode;
    
    document.getElementById("formTitle").innerText = isSignUpMode ? "إنشاء حساب جديد" : "تسجيل الدخول";
    document.getElementById("fullName").style.display = isSignUpMode ? "block" : "none";
    document.getElementById("authSubmitBtn").innerText = isSignUpMode ? "إنشاء حساب" : "دخول";
    document.getElementById("toggleAuthMode").innerText = isSignUpMode ? "لديك حساب بالفعل؟ سجل دخولك" : "ليس لديك حساب؟ أنشئ حساباً جديداً";
  };

  // معالجة تسجيل الدخول / إنشاء الحساب
  window.handleAuth = async () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("يرجى ملء كافة الحقول!");
      return;
    }

    try {
      if (isSignUpMode) {
        const fullName = document.getElementById("fullName").value;

        if (!fullName) {
          alert("يرجى إدخال الاسم الكامل");
          return;
        }

        // تحديد دور الحساب تلقائياً: معلم فقط إذا طابق البريد المحدد، وخلافه تلميذ
        let role = "student";
        if (email.toLowerCase() === "mohammadba1999142@gmail.com".toLowerCase()) {
          role = "teacher";
        }

        const userCred = await createUserWithEmailAndPassword(auth, email, password);
        
        // حفظ بيانات المستخدم في Firestore
        await setDoc(doc(db, "users", userCred.user.uid), {
          name: fullName,
          email: email,
          role: role,
          createdAt: new Date()
        });

        alert("تم إنشاء الحساب بنجاح!");
      } else {
        // تسجيل الدخول
        await signInWithEmailAndPassword(auth, email, password);
        alert("تم تسجيل الدخول بنجاح!");
      }
      
      document.getElementById("loginBox").style.display = "none";
    } catch (error) {
      alert("خطأ: " + error.message);
    }
  };

  // مراقبة حالة تسجيل الدخول وتحديث الواجهة تلقائياً
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const userDoc = await getDoc(doc(db, "users", user.uid));
      if (userDoc.exists()) {
        currentUserData = { uid: user.uid, ...userDoc.data() };
        
        document.getElementById("loginMenuItem").style.display = "none";
        document.getElementById("userInfo").style.display = "block";
        document.getElementById("userInfo").innerText = `مرحباً: ${currentUserData.name} (${currentUserData.role === 'teacher' ? 'معلم' : 'تلميذ'})`;
        document.getElementById("logoutBtn").style.display = "block";

        if (currentUserData.role === "teacher") {
          document.getElementById("teacherPanel").style.display = "block";
        } else {
          document.getElementById("teacherPanel").style.display = "none";
        }
      }
    } else {
      currentUserData = null;
      document.getElementById("loginMenuItem").style.display = "block";
      document.getElementById("userInfo").style.display = "none";
      document.getElementById("teacherPanel").style.display = "none";
      document.getElementById("logoutBtn").style.display = "none";
    }
  });

  // تسجيل الخروج
  window.logout = async () => {
    await signOut(auth);
    alert("تم تسجيل الخروج");
  };

  // حفظ علامة الطالب في قاعدة البيانات
  window.saveMark = async (mark) => {
    if (!currentUserData) {
      alert("لازم تسجل دخول كطالب أولاً");
      return;
    }

    if (currentUserData.role !== "student") {
      alert("المعلم لا يحفظ تمارين الطلاب بهذه الطريقة!");
      return;
    }

    try {
      await addDoc(collection(db, "results"), {
        studentId: currentUserData.uid,
        studentName: currentUserData.name,
        score: mark + "/10",
        quizTitle: "تمرين تجريبي",
        date: new Date()
      });
      alert("تم حفظ النتيجة في حسابك وحساب المعلم بنجاح!");
    } catch (error) {
      alert("خطأ في حفظ النتيجة: " + error.message);
    }
  };

  // عرض نتائج الطلاب (للمعلم فقط)
 window.showResults = async () => {
    try {
        const querySnapshot = await getDocs(collection(db, "results"));

        let text = "📊 نتائج الطلاب المسجلة:\n\n";

        if (querySnapshot.empty) {
            alert("ما في نتائج مسجلة بعد");
            return;
        }

        querySnapshot.forEach((doc) => {

            const res = doc.data();

            text +=
                `👤 ${res.studentName || "غير معروف"}\n` +
                `📝 التمرين: ${res.activityTitle || res.quizTitle || "غير محدد"}\n` +
                `⭐ النتيجة: ${res.points ?? res.score ?? 0}\n` +
                `📅 التاريخ: ${
                    res.date?.toDate
                    ? res.date.toDate().toLocaleString("ar-SY")
                    : "غير محدد"
                }\n` +
                `----------------------\n`;
        });

        alert(text);

    } catch (error) {

        alert(
            "خطأ في جلب النتائج: " +
            error.message
        );

    }
};

  window.closePopup = () => {
    document.getElementById("popup").style.display = "none";
  };
</script>

</body>
</html>
