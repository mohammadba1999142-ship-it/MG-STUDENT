<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منصة الطلاب</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Cairo', sans-serif;

  background: url("background.png") no-repeat center center fixed;
  background-size: cover;
}

/* طبقة خفيفة فوق الصورة */
.overlay {
  background-color: rgba(0, 0, 0, 0.4);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* الصندوق */
.container {
  background: rgba(255, 255, 255, 0.95);
  padding: 40px;
  border-radius: 20px;
  text-align: center;
  width: 90%;
  max-width: 400px;
}

/* العنوان */
h1 {
  margin-bottom: 10px;
}

/* الوصف */
p {
  margin-bottom: 25px;
}

/* الزر */
button {
  background: #4CAF50;
  color: white;
  border: none;
  padding: 15px 25px;
  font-size: 18px;
  border-radius: 10px;
  cursor: pointer;
}

button:hover {
  background: #45a049;
}
</style>
</head>

<body>

<div class="overlay">
  <div class="container">
    <h1>منصة الطلاب 📚</h1>
    <p>ابدأ التعلم بطريقة ممتعة</p>
    <button>ابدأ الآن</button>
  </div>
</div>

</body>
</html>
