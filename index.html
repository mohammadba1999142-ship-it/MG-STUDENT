<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>منصة الطلاب</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Arial;
  display: flex;
  background: #f4f7fb;
}

/* القائمة */
.sidebar {
  width: 250px;
  background: #1e293b;
  color: white;
  padding: 20px;
  height: 100vh;
}

.sidebar h2 {
  text-align: center;
  margin-bottom: 30px;
}

.menu-item {
  background: #334155;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.menu-item:hover {
  background: #475569;
  transform: scale(1.05);
}

/* المحتوى */
.main {
  flex: 1;
  padding: 50px;
  text-align: center;
}

h1 {
  font-size: 45px;
  color: #1e293b;
}

p {
  font-size: 20px;
  color: #555;
}
</style>

</head>

<body>

<div class="sidebar">
  <h2>📚 الأنشطة</h2>

  <div class="menu-item">📘 أنشطة اللغة العربية</div>
  <div class="menu-item">🔢 أنشطة الرياضيات</div>
</div>

<div class="main">
  <h1>🎓 منصة الطلاب</h1>
  <p>اختر النشاط من القائمة على اليمين</p>
</div>

</body>
</html>
