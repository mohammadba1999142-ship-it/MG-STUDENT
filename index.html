<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>MG STUDENT</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<style>

/* ===== الأساسيات ===== */
body {
  margin: 0;
  font-family: 'Cairo', sans-serif;
  background-image: url("background.png");
  background-size: 80%;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

/* ===== النافذة المنبثقة ===== */
.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1000;
}

.popup-content {
  background: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
}

.popup button {
  margin-top: 15px;
  padding: 10px 20px;
  border: none;
  background: #4CAF50;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

/* ===== القائمة الجانبية ===== */
.sidebar {
  position: fixed;
  right: 0;
  top: 0;
  width: 220px;
  height: 100%;
  background: rgba(255,255,255,0.9);
  padding: 20px;
  box-shadow: -2px 0 10px rgba(0,0,0,0.1);
}

.menu-item {
  margin: 15px 0;
  padding: 15px;
  background: #f1f1f1;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.menu-item:hover {
  background: #4CAF50;
  color: white;
}

/* ===== تسجيل الدخول ===== */
.login-box {
  position: fixed;
  left: 20px;
  top: 120px;
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 220px;
  box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

/* ===== أزرار التمرين ===== */
.actions {
  position: fixed;
  bottom: 20px;
  left: 20px;
}

.actions button {
  padding: 10px 15px;
  margin: 5px;
  border: none;
  background: #2196F3;
  color: white;
  border-radius: 8px;
  cursor: pointer;
}

</style>
</head>

<body>

<!-- 🔥 النافذة -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h2>👋 مرحباً بك</h2>
    <button onclick="closePopup()">دخول</button>
  </div>
</div>

<!-- 📌 القائمة الجانبية -->
<div class="sidebar">
  <div class="menu-item" onclick="openLogin()">🔐 تسجيل الدخول</div>

  <!-- يظهر فقط للمعلم -->
  <div id="teacherPanel" style="display:none;">
    <div class="menu-item" onclick="showResults()">📊 عرض النتائج</div>
  </div>

  <div class="menu-item">📚 تمارين اللغة العربية</div>
  <div class="menu-item">➗ تمارين الرياضيات</div>
</div>

<!-- 🟢 صندوق تسجيل الدخول (مخفي بالبداية) -->
<div id="loginBox" class="login-box" style="display:none;">
  <h3>تسجيل الدخول</h3>
  <input type="text" id="username" placeholder="اسم المستخدم">
  <input type="password" id="password" placeholder="كلمة المرور">
  <button onclick="login()">دخول</button>
</div>

<!-- 🟡 أزرار تجربة -->
<div class="actions">
  <button onclick="saveMark(10)">إنهاء التمرين</button>
</div>

<script>

// بيانات الطلاب (تجريبية)
let students = [
  {name: "ali", pass: "123", marks: []},
  {name: "sara", pass: "123", marks: []}
];

let currentStudent = null;

// فتح صندوق تسجيل الدخول
function openLogin() {
  document.getElementById("loginBox").style.display = "block";
}

// تسجيل الدخول
function login() {
  let user = document.getElementById("username").value;
  let pass = document.getElementById("password").value;

  // تسجيل دخول المعلم
  if(user === "admin" && pass === "1234") {
    alert("تم تسجيل الدخول كمعلم");

    document.getElementById("teacherPanel").style.display = "block";
    document.getElementById("loginBox").style.display = "none";
    return;
  }

  // تسجيل دخول طالب
  let found = students.find(s => s.name === user && s.pass === pass);

  if(found){
    currentStudent = found;
    alert("تم تسجيل الدخول كطالب");
    document.getElementById("loginBox").style.display = "none";
  } else {
    alert("خطأ في البيانات");
  }
}

// حفظ علامة الطالب
function saveMark(mark){
  if(currentStudent){
    currentStudent.marks.push(mark);
    alert("تم حفظ النتيجة");
  } else {
    alert("لازم تسجل دخول كطالب أولاً");
  }
}

// عرض نتائج الطلاب (للمعلم فقط)
function showResults(){
  let text = "";

  students.forEach(s => {
    text += s.name + " : " + s.marks.join(", ") + "\n";
  });

  alert(text || "ما في نتائج بعد");
}

// إغلاق النافذة
function closePopup() {
  document.getElementById("popup").style.display = "none";
}

</script>

</body>
</html>
