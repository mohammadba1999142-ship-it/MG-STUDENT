<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>MG STUDENT</title>

<style>

/* ===== الأساسيات ===== */
body {
  margin: 0;
  font-family: 'Cairo', sans-serif;
}
 background-image: url("background.png");
  background-size: 80%;       /* الحجم 80% */
  background-position: top center;
  background-repeat: no-repeat; /* ما تتكرر */
  background-position: center; /* تكون بالنص */
  background-attachment: fixed; /* تثبت مكانها */

/* ===== النافذة المنبثقة ===== */
.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
}

.popup-content {
  background: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
}

.popup button {
  margin-top: 15px;
  padding: 10px 20px;
  border: none;
  background: #4CAF50;
  color: white;
  border-radius: 10px;
  cursor: pointer;
}

/* ===== القائمة الجانبية ===== */
.sidebar {
  position: fixed;
  right: 0;
  top: 0;
  width: 220px;
  height: 100%;
  background: rgba(255,255,255,0.9);
  padding: 20px;
  box-shadow: -2px 0 10px rgba(0,0,0,0.1);
}

.menu-item {
  margin: 15px 0;
  padding: 15px;
  background: #f1f1f1;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.menu-item:hover {
  background: #4CAF50;
  color: white;
}

/* ===== الكروت ===== */
.container {
  margin-right: 240px;
  padding: 50px;
  text-align: center;
}

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 15px;
  font-size: 20px;
  transition: 0.3s;
  cursor: pointer;
}

.card:hover {
  transform: translateY(-10px);
  background: #2196F3;
  color: white;
}

</style>
</head>

<body>

<!-- 🔥 النافذة -->
<div class="popup" id="popup">
  <div class="popup-content">
    <h2>👋 مرحباً بك</h2>
    <p>أهلاً بك في موقع الطالب</p>
    <button onclick="closePopup()">دخول</button>
  </div>
</div>

<!-- 📌 القائمة الجانبية -->
<div class="sidebar">
  <div class="menu-item">🔐 تسجيل الدخول</div>
  <div class="menu-item">📚 تمارين اللغة العربية</div>
  <div class="menu-item">➗ تمارين الرياضيات</div>
</div>

<!-- 🎯 الكروت -->
<div class="container">
  <h1>اختر القسم</h1>

  <div class="cards">
    <div class="card">📚 اللغة العربية</div>
    <div class="card">➗ الرياضيات</div>
  </div>
</div>

<script>
function closePopup() {
  document.getElementById("popup").style.display = "none";
}
</script>

</body>
</html>
