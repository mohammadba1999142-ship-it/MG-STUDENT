<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>منصة الطلاب</title>

<style>body {
  margin: 0;
  font-family: 'Segoe UI', Arial;
  display: flex;

  background: url("background.png") no-repeat center center fixed;
  background-size: cover;
}

/* طبقة تخفيف (حتى يضل النص واضح) */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.5);
  z-index: -1;
}

.menu-item {
  background: #334155;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.3s;
}

.menu-item:hover {
  background: #475569;
  transform: scale(1.05);
}

/* المحتوى */
.main {
  flex: 1;
  padding: 50px;
  text-align: center;
}

h1 {
  font-size: 45px;
  color: #1e293b;
}

p {
  font-size: 20px;
  color: #555;
}
</style>

</head>

<body>

<div class="sidebar">
  <h2>📚 الأنشطة</h2>

  <div class="menu-item">📘 أنشطة اللغة العربية</div>
  <div class="menu-item">🔢 أنشطة الرياضيات</div>
</div>

<div class="main">
  <h1>🎓 منصة الطلاب</h1>
  <p>اختر النشاط من القائمة على اليمين</p>
</div>

</body>
</html>
