<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>لوحة المعلم</title>

    <style>

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f4f7f9;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        .results-container {
            max-width: 1000px;
            margin: auto;
        }

        .result-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .student-name {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .info {
            margin: 8px 0;
            font-size: 16px;
        }

        .points {
            color: #e69b00;
            font-weight: bold;
        }

        .correct {
            color: #20a05a;
            font-weight: bold;
        }

        .wrong {
            color: #e53935;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .details-btn {
            background: #2196F3;
            color: white;
        }

        .delete-btn {
            background: #e53935;
            color: white;
        }

        .details {
            display: none;
            margin-top: 18px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }

        .question {
            background: #f7f9fb;
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
        }

        .question-title {
            font-weight: bold;
            font-size: 17px;
            margin-bottom: 10px;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 15px;
            color: #777;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .result-card {
                padding: 15px;
            }

            .student-name {
                font-size: 18px;
            }

            .info {
                font-size: 14px;
            }

            button {
                width: 100%;
            }
        }

    </style>
</head>


<body>

<h1>لوحة تحكم المعلم 👨‍🏫</h1>

<div class="results-container" id="resultsContainer">

    <div class="empty">
        جاري تحميل النتائج...
    </div>

</div>


<script type="module">

    import { db, auth } from "./firebase-config.js";

    import {
        collection,
        getDocs,
        doc,
        getDoc,
        deleteDoc
    }
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    // ==========================================
    // التحقق من حساب المعلم
    // ==========================================

    auth.onAuthStateChanged(async (user) => {

        if (!user) {

            alert("يجب تسجيل الدخول أولاً");

            window.location.href = "index.html";

            return;
        }


        try {

            const userDoc = await getDoc(
                doc(db, "users", user.uid)
            );


            if (
                !userDoc.exists() ||
                userDoc.data().role !== "teacher"
            ) {

                alert(
                    "ليس لديك صلاحية الدخول إلى لوحة المعلم"
                );

                window.location.href = "student.html";

                return;
            }


            loadResults();

        }

        catch (error) {

            console.error(error);

            alert(
                "حدث خطأ أثناء التحقق من الحساب"
            );

        }

    });



    // ==========================================
    // تحميل النتائج
    // ==========================================

    async function loadResults() {

        const container =
            document.getElementById(
                "resultsContainer"
            );


        container.innerHTML = "";


        try {

            const snapshot =
                await getDocs(
                    collection(db, "results")
                );


            if (snapshot.empty) {

                container.innerHTML = `
                    <div class="empty">
                        لا توجد نتائج حتى الآن.
                    </div>
                `;

                return;
            }


            snapshot.forEach((resultDoc) => {

                const data =
                    resultDoc.data();


                const resultId =
                    resultDoc.id;


                const card =
                    document.createElement("div");


                card.className =
                    "result-card";


                // ==================================
                // إنشاء البطاقة
                // ==================================

                card.innerHTML = `

                    <div class="student-name">
                        👤 ${data.studentName || "تلميذ"}
                    </div>

                    <div class="info">
                        📝 النشاط:
                        <strong>
                            ${data.activityTitle || "غير محدد"}
                        </strong>
                    </div>

                    <div class="info">
                        🎓 الصف:
                        ${data.grade || "غير محدد"}
                    </div>

                    <div class="info">
                        📅 تاريخ الحل:
                        ${formatDate(data.date)}
                    </div>

                    <div class="info">
                        ✅ الأسئلة الصحيحة:
                        <span class="correct">
                            ${data.correctQuestions ?? 0}
                        </span>
                    </div>

                    <div class="info points">
                        ⭐ النقاط:
                        ${data.points ?? 0}
                    </div>

                    <div class="buttons">

                        <button class="details-btn">
                            🔍 عرض التفاصيل
                        </button>

                        <button class="delete-btn">
                            🗑 حذف النتيجة
                        </button>

                    </div>

                    <div class="details"></div>
                `;


                container.appendChild(card);


                // ==================================
                // زر عرض التفاصيل
                // ==================================

                const detailsButton =
                    card.querySelector(
                        ".details-btn"
                    );


                const detailsBox =
                    card.querySelector(
                        ".details"
                    );


                detailsButton.addEventListener(
                    "click",
                    () => {

                        if (
                            detailsBox.style.display
                            === "block"
                        ) {

                            detailsBox.style.display =
                                "none";

                            detailsButton.innerText =
                                "🔍 عرض التفاصيل";

                            return;
                        }


                        showQuestions(
                            data.questions,
                            detailsBox
                        );


                        detailsBox.style.display =
                            "block";


                        detailsButton.innerText =
                            "🔼 إخفاء التفاصيل";

                    }
                );



                // ==================================
                // زر حذف النتيجة
                // ==================================

                const deleteButton =
                    card.querySelector(
                        ".delete-btn"
                    );


                deleteButton.addEventListener(
                    "click",
                    async () => {

                        const confirmed =
                            confirm(
                                `هل أنت متأكد من حذف نتيجة
${data.studentName || "التلميذ"}
في نشاط
${data.activityTitle || "هذا النشاط"}؟`
                            );


                        if (!confirmed) {
                            return;
                        }


                        try {

                            await deleteDoc(
                                doc(
                                    db,
                                    "results",
                                    resultId
                                )
                            );


                            alert(
                                "تم حذف النتيجة بنجاح ✅"
                            );


                            loadResults();

                        }

                        catch (error) {

                            console.error(error);

                            alert(
                                "حدث خطأ أثناء حذف النتيجة"
                            );

                        }

                    }
                );

            });

        }

        catch (error) {

            console.error(error);

            container.innerHTML = `
                <div class="empty">
                    حدث خطأ أثناء تحميل النتائج.
                </div>
            `;

        }

    }



    // ==========================================
    // تفاصيل الأسئلة
    // ==========================================

    function showQuestions(
        questions,
        detailsBox
    ) {

        detailsBox.innerHTML = "";


        if (
            !questions ||
            questions.length === 0
        ) {

            detailsBox.innerHTML = `
                <p>
                    لا توجد تفاصيل محفوظة لهذا النشاط.
                </p>
            `;

            return;
        }


        questions.forEach(
            (question, index) => {

                const box =
                    document.createElement("div");


                box.className =
                    "question";


                const attempts =
                    question.attempts ?? 0;


                const finalAnswer =
                    question.finalAnswer ??
                    "غير محددة";


                const correctAnswer =
                    question.correctAnswer ??
                    "غير محددة";


                const isCorrect =
                    question.correct === true;


                box.innerHTML = `

                    <div class="question-title">
                        السؤال ${index + 1}
                    </div>

                    <div>
                        ${question.questionText || "السؤال"}
                    </div>

                    <hr>

                    <div>
                        🔢 عدد المحاولات:
                        <strong>
                            ${attempts}
                        </strong>
                    </div>

                    <div style="margin-top:8px;">
                        📝 الإجابة النهائية:
                        <strong>
                            ${finalAnswer}
                        </strong>
                    </div>

                    <div style="margin-top:8px;">
                        ✅ الإجابة الصحيحة:
                        <strong>
                            ${correctAnswer}
                        </strong>
                    </div>

                    <div style="margin-top:8px;"
                         class="${
                            isCorrect
                            ? "correct"
                            : "wrong"
                         }">

                        ${
                            isCorrect
                            ? "صحيح ✅"
                            : "خطأ ❌"
                        }

                    </div>

                `;


                detailsBox.appendChild(box);

            }
        );

    }



    // ==========================================
    // تنسيق التاريخ
    // ==========================================

    function formatDate(dateValue) {

        if (!dateValue) {
            return "غير محدد";
        }


        try {

            let date;


            if (
                typeof dateValue.toDate ===
                "function"
            ) {

                date =
                    dateValue.toDate();

            }

            else {

                date =
                    new Date(dateValue);

            }


            return date.toLocaleString(
                "ar-SY",
                {
                    year: "numeric",
                    month: "2-digit",
                    day: "2-digit",
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        }

        catch {

            return "غير محدد";

        }

    }

</script>

</body>
</html>
